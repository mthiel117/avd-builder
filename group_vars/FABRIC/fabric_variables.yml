---
# Common AVD group variables
fabric_name: FABRIC

# Generate CSVs with fabric link info
eos_designs_documentation:
  topology_csv: true
  p2p_links_csv: true

# Define underlay and overlay routing protocol to be used
underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# Local users
aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      no_password: true

custom_structured_configuration_aaa_authorization:
  exec:
    default: local

custom_structured_configuration_aaa_authentication:
  policies:
    local:
      allow_nopassword: true

# Set default uplink, downlink, and MLAG interfaces based on node type
default_interfaces:
  - types: [spine]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    downlink_interfaces: [Ethernet1-8]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    mlag_interfaces: [Ethernet3-4]
    downlink_interfaces: [Ethernet8]

custom_platform_settings:
  - platforms:
      - CEOS
      - cEOS
      - ceos
      - cEOSLab
    management_interface: Management1

# DNS Server
dns_settings:
  servers:
    - ip_address: 192.168.1.1

# NTP Servers
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 0.pool.ntp.org
